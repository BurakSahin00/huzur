# Render Blueprint: Huzur sunucusu (FastAPI).
# Render'da New > Blueprint > bu repo. "sync: false" olan değerleri Render ilk kurulumda sorar;
# gizli değerler bu dosyaya ve depoya asla yazılmaz.
# Dağıtım yalnızca server/ altındaki değişikliklerde tetiklenir (rootDir).
services:
  - type: web
    name: huzur-api
    runtime: python
    region: frankfurt
    plan: free # demo için kart ekleyebiliyorsan 0.5c-512mb (saniye bazında ücret)
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: RPC_URL
        value: https://testnet-rpc.monad.xyz
      - key: CONTRACT_ADDRESS
        sync: false
      - key: ILKGELEN_ADDRESS
        sync: false
      - key: WEB_ORIGINS
        sync: false
      - key: OPERATOR_PRIVATE_KEY
        sync: false
      - key: BOT_PRIVATE_KEY
        sync: false
      - key: HMAC_KEY
        sync: false
      - key: SEED_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
